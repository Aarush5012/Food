<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/global.css" />

    <title>Register | Zaika</title>
    <meta charset="UTF-8">
    <style>
        body { font-family: sans-serif; background: #f5f5f5; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .form-container {
          background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.1);
          width: 350px;
        }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        input[type=text], input[type=password] {
          width: 100%; padding: 0.7rem; margin-bottom: 1rem; border-radius: 6px; border: 1px solid #ccc;
        }
        button {
          width: 100%; padding: 0.8rem; background-color: #27ae60; color: white; border: none;
          border-radius: 6px; font-size: 1rem; cursor: pointer;
        }
        .error { color: red; text-align: center; margin-top: 1rem; }
    </style>
</head>
<body>

<div class="form-container">
    <h2>Create Account</h2>
    <form th:action="@{/register}" method="post" th:object="${user}">
        <input type="text" th:field="*{username}" placeholder="Username" required />
        <input type="password" th:field="*{password}" placeholder="Password" required />
        <button type="submit">Register</button>
    </form>
    <p class="error" th:if="${error}" th:text="${error}"></p>
</div>
</body>
</html>
