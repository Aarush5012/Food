<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <link rel="stylesheet" href="/css/global.css" />
  <title>Your Cart | Zaika</title>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f4f6f8;
      padding: 2rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 2rem;
      background: #ffffffcc;
      padding: 1rem 2rem;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
      max-width: 600px;
      margin-left: auto;
      margin-right: auto;
    }

    table {
      margin: auto;
      width: 95%;
      border-collapse: collapse;
      background-color: white;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    th {
      background-color: #3498db;
      color: white;
      padding: 1rem;
      text-align: center;
    }

    td {
      padding: 1rem;
      border-top: 1px solid #ccc;
      text-align: center;
      vertical-align: middle;
    }

    .cart-img {
      width: 60px;
      height: 40px;
      object-fit: cover;
      border-radius: 6px;
    }

    input[type="number"] {
      width: 60px;
      padding: 0.4rem;
      border-radius: 6px;
      border: 1px solid #ccc;
      text-align: center;
    }

    .update-btn, .remove-btn {
      background-color: #3498db;
      color: white;
      border: none;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      cursor: pointer;
      margin: 0.2rem;
    }

    .remove-btn {
      background-color: #e74c3c;
    }

    .total-row {
      background: #ffffffcc;
      font-size: 1.2rem;
      font-weight: bold;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      margin-top: 2.5rem;
    }

    .actions button, .actions a {
      padding: 0.8rem 1.6rem;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    .place-order-btn {
      background-color: #2ecc71;
      color: white;
    }

    .back-btn {
      background-color: #3498db;
      color: white;
    }

    .empty-message {
      text-align: center;
      font-size: 1.2rem;
      color: #888;
      margin-top: 4rem;
    }
  </style>
</head>
<body>

<h1>Your Cart</h1>

<div th:if="${cartItems.size() > 0}">
  <table>
    <thead>
    <tr>
      <th>Item</th>
      <th>Image</th>
      <th>Qty</th>
      <th>Price</th>
      <th>Subtotal</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="item : ${cartItems}">
      <td th:text="${item.name}">Butter Chicken</td>
      <td><img class="cart-img" th:src="@{${item.imagePath}}" alt="Dish" /></td>

      <!-- Update Quantity Form -->
      <td>
        <form th:action="@{/user/update-cart}" method="post">
          <input type="number" name="quantities" th:value="${item.quantity}" min="1" />
          <input type="hidden" name="itemNames" th:value="${item.name}" />
          <button type="submit" class="update-btn">Update</button>
        </form>
      </td>

      <td th:text="'₹' + ${item.price}">₹200</td>
      <td th:text="'₹' + (${item.price} * ${item.quantity})">₹400</td>

      <!-- Remove Button -->
      <td>
        <form th:action="@{/user/remove-from-cart}" method="post">
          <input type="hidden" name="itemName" th:value="${item.name}" />
          <button type="submit" class="remove-btn">Remove</button>
        </form>
      </td>
    </tr>
    </tbody>

    <tfoot>
    <tr class="total-row">
      <td colspan="4">Total</td>
      <td colspan="2" th:text="'₹' + ${total}">₹0</td>
    </tr>
    </tfoot>
  </table>

  <div class="actions">
    <form th:action="@{/user/place-order}" method="post">
      <button type="submit" class="place-order-btn">✅ Place Order</button>
    </form>
    <a th:href="@{/user/dashboard}" class="back-btn">← Back to Menu</a>
  </div>
</div>

<div th:if="${cartItems.size() == 0}" class="empty-message">
  Your cart is currently empty.
</div>

</body>
</html>
