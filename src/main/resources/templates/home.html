<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/global.css" />

    <title>Zaika | Home</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;

            background-image: url('/images/zaika_home.png');
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center top;
            background-attachment: scroll;
            background-position-y: -180px;

            display: flex;
            justify-content: center;
            align-items: flex-end;
            padding-bottom: 4rem;
        }

        .wrapper {
            display: flex;
            gap: 3rem;
            align-items: flex-start;
            margin-bottom: 2cm;
        }

        .box {
            background: rgba(255, 255, 255, 0.8);
            border-radius: 8px;
            padding: 2rem;
            text-align: center;
            width: 250px;
            min-height: 220px; /* ✅ Ensures equal height for all boxes */
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .box h2 {
            color: #222;
        }

        .box a {
            text-decoration: none;
            color: pink;
            background: #3498db;
            padding: 0.7rem 1.2rem;
            border-radius: 6px;
            display: inline-block;
            margin-top: 1rem;
            font-weight: bold;
        }

        .box a.register {
            background: #2ecc71;
        }

        .guest-link {
            margin-top: 1.5rem;
        }

        .guest-link a {
            text-decoration: none;
            color: white;
            background: #8e44ad;
            padding: 0.7rem 1.5rem;
            border-radius: 6px;
            font-weight: bold;
            font-size: 1rem;
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        .user-section {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <!-- User Side -->
    <div class="user-section">
        <div class="box">
            <h2>USER</h2>
            <a href="/login">Login</a><br>
            <a href="/register" class="register">Register</a>
        </div>
        <div class="guest-link">
            <a href="/guest/menu">Continue as Guest →</a>
        </div>
    </div>

    <!-- Admin Side -->
    <div class="box">
        <h2>ADMIN</h2>
        <a href="/login?admin=true">Login</a>
    </div>
</div>

</body>
</html>
