<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="stylesheet" href="/css/global.css" />
    <title>Admin Menu | Zaika</title>
    <meta charset="UTF-8">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            padding: 2rem;
        }

        .heading-box {
            background-color: #d0ebff;
            padding: 1rem 1.5rem;
            border-radius: 8px;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            margin-bottom: 2rem;
            color: #2c3e50;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
        }

        .menu-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background: #ffe6ea; /* 🔴 Light Pink background */
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 1rem;
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-radius: 10px;
        }

        .item-name {
            font-size: 1.1rem;
            font-weight: bold;
            margin: 0.6rem 0 0.2rem;
        }

        .rating {
            font-size: 0.9rem;
            color: #888;
            margin-bottom: 0.8rem;
        }

        .price-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }

        .price-controls button {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 0.4rem 0.8rem;
            font-size: 1rem;
            border-radius: 6px;
            cursor: pointer;
        }

        .price-controls input[type="number"] {
            width: 80px;
            padding: 0.4rem;
            font-size: 1rem;
            text-align: center;
        }

        #updateBtn {
            display: block;
            margin: 2rem auto 1rem;
            padding: 0.8rem 2rem;
            font-size: 1rem;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .back-link-btn {
            display: block;
            margin: 1rem auto;
            text-align: center;
            padding: 0.6rem 1.5rem;
            background-color: #6c757d;
            color: white;
            text-decoration: none;
            border-radius: 6px;
            width: fit-content;
            font-size: 0.95rem;
        }

        .back-link-btn:hover {
            background-color: #5a6268;
        }
    </style>
</head>
<body>


<div class="heading-box">Admin Menu Management</div>

<form th:action="@{/admin/menu/update-prices}" method="post" th:object="${menuItems}">
    <div class="menu-container">
        <div class="card" th:each="item, iterStat : *{menuItems}">
            <img th:src="@{${item.imagePath}}" alt="Dish Image">
            <div class="item-name" th:text="${item.name}">Dish Name</div>
            <div class="rating">⭐ <span th:text="${item.rating}">4.5</span>/5</div>

            <div class="price-controls">
                <button type="button" th:onclick="'decreasePrice(' + ${iterStat.index} + ')'">−</button>
                <input type="number" step="0.01" th:field="*{menuItems[__${iterStat.index}__].price}" />
                <input type="hidden" th:field="*{menuItems[__${iterStat.index}__].id}" />
                <button type="button" th:onclick="'increasePrice(' + ${iterStat.index} + ')'">+</button>
            </div>
        </div>
    </div>

    <button id="updateBtn" type="submit">Update Prices</button>
</form>

<a class="back-link-btn" th:href="@{/admin/dashboard}">← Back to Dashboard</a>

<script>
    function increasePrice(index) {
        const inputs = document.querySelectorAll("input[name$='.price']");
        if (inputs[index]) {
            let current = parseFloat(inputs[index].value) || 0;
            inputs[index].value = (current + 10).toFixed(2);
        }
    }

    function decreasePrice(index) {
        const inputs = document.querySelectorAll("input[name$='.price']");
        if (inputs[index]) {
            let current = parseFloat(inputs[index].value) || 0;
            if (current > 10) {
                inputs[index].value = (current - 10).toFixed(2);
            } else {
                inputs[index].value = "0.00";
            }
        }
    }
</script>


</body>
</html>
