spring.application.name=zaika
spring.datasource.url=jdbc:mysql://sql.freedb.tech:3306/freedb_U2g2wSdT
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true


logging.level.org.thymeleaf=DEBUG
logging.level.org.thymeleaf.TemplateEngine=TRACE
logging.level.org.thymeleaf.templateresolver=TRACE
logging.level.org.thymeleaf.TemplateRepository=TRACE

